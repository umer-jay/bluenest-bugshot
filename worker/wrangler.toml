name = "bluenest-bugshot-oauth"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Created via `wrangler kv namespace create TOKENS` — replace with the real
# id it prints before deploying. Holds one entry per extension install:
# key = installId (a random UUID the extension generates itself),
# value = the JSON token response from Notion (access_token, refresh_token,
# workspace_name, etc.) for that install.
kv_namespaces = [
  { binding = "TOKENS", id = "1f342c4d2b4048c8b16791d1bc68497a" }
]

# Secrets (NOTION_CLIENT_ID, NOTION_CLIENT_SECRET) are set via
# `wrangler secret put <NAME>`, never written here or committed anywhere.
