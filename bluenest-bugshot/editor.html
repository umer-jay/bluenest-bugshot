<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bluenest Bugshot — Editor</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <main>
      <p id="meta" class="meta"></p>

      <div class="toolbar" id="toolbar">
        <div class="tool-group" role="group" aria-label="Tools">
          <button type="button" class="tool-btn" data-tool="select" aria-pressed="true" title="Select — click here to stop drawing without picking another tool">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
          </button>
          <button type="button" class="tool-btn" data-tool="move" title="Move — drag an existing annotation to reposition it">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
          </button>
          <button type="button" class="tool-btn" data-tool="text" title="Text">T</button>
          <button type="button" class="tool-btn" data-tool="arrow" title="Arrow">↗</button>
          <button type="button" class="tool-btn" data-tool="rect" title="Rectangle">▢</button>
          <button type="button" class="tool-btn" data-tool="blur" title="Blur — drag over something to pixelate it (e.g. emails, account IDs)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="2" y="2" width="6" height="6"/><rect x="9" y="2" width="6" height="6" opacity="0.5"/><rect x="16" y="2" width="6" height="6"/><rect x="2" y="9" width="6" height="6" opacity="0.5"/><rect x="9" y="9" width="6" height="6"/><rect x="16" y="9" width="6" height="6" opacity="0.5"/><rect x="2" y="16" width="6" height="6"/><rect x="9" y="16" width="6" height="6" opacity="0.5"/><rect x="16" y="16" width="6" height="6"/></svg>
          </button>
          <button type="button" class="tool-btn" data-tool="crop" title="Crop — drag to select the area to keep">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.13 1L6 16a2 2 0 0 0 2 2h15"/><path d="M1 6.13L16 6a2 2 0 0 1 2 2v15"/></svg>
          </button>
        </div>

        <div class="color-group" role="group" aria-label="Color">
          <button type="button" class="color-swatch" data-color="#dc2626" style="--swatch:#dc2626" aria-pressed="true" title="Red"></button>
          <button type="button" class="color-swatch" data-color="#ea580c" style="--swatch:#ea580c" title="Orange"></button>
          <button type="button" class="color-swatch" data-color="#16a34a" style="--swatch:#16a34a" title="Green"></button>
          <button type="button" class="color-swatch" data-color="#2563eb" style="--swatch:#2563eb" title="Blue"></button>
          <button type="button" class="color-swatch" data-color="#111827" style="--swatch:#111827" title="Black"></button>
          <button type="button" class="color-swatch" data-color="#ffffff" style="--swatch:#ffffff" title="White"></button>
        </div>

        <div class="size-group" role="group" aria-label="Text size">
          <button type="button" id="font-size-decrease" title="Smaller text">−</button>
          <span id="font-size-display" aria-live="polite">16px</span>
          <button type="button" id="font-size-increase" title="Larger text">+</button>
        </div>

        <div class="action-group">
          <button type="button" id="undo-button" title="Undo (Ctrl/Cmd+Z)">Undo</button>
          <button type="button" id="clear-button" title="Clear all annotations">Clear</button>
        </div>
      </div>

      <div class="crop-actions" id="crop-actions" hidden>
        <span>Drag again to adjust, or:</span>
        <button type="button" id="cancel-crop-button">Cancel</button>
        <button type="button" id="apply-crop-button">Apply Crop</button>
      </div>

      <p class="hints">Shortcuts: Ctrl/Cmd+Z to undo · Enter to confirm text · Esc to cancel the current text box, an in-progress move, or a pending crop</p>

      <div class="canvas-wrap">
        <div class="canvas-stack" id="canvas-stack">
          <canvas id="base-canvas"></canvas>
          <canvas id="annotation-canvas"></canvas>
        </div>
      </div>

      <form id="details-form" class="details-form">
        <label for="title-input">Title</label>
        <input type="text" id="title-input" placeholder="Short description of the issue" required />

        <label for="severity-select">Severity</label>
        <select id="severity-select">
          <option value="Low">Low</option>
          <option value="Medium" selected>Medium</option>
          <option value="High">High</option>
          <option value="Critical">Critical</option>
        </select>

        <label for="notes-textarea">Notes</label>
        <textarea id="notes-textarea" rows="3" placeholder="Steps to reproduce, extra context..."></textarea>

        <div class="form-actions">
          <button type="button" id="copy-button" title="Copy the flattened image to your clipboard">Copy Image</button>
          <button type="button" id="cancel-button">Cancel</button>
          <button type="submit" id="send-button">
            <span class="spinner" id="send-spinner" hidden></span>
            <span id="send-label">Send</span>
          </button>
        </div>

        <p id="status" class="status" role="status"></p>
      </form>

      <p id="error" class="error" hidden></p>
    </main>
    <script type="module" src="editor.js"></script>
  </body>
</html>
